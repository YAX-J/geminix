server:
  port: 9000

spring:
  application:
    name: worklog-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境可用环境变量覆盖：DB_URL / DB_USERNAME / DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://121.199.172.128:3306/worklog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:worklog}
    # 密码不写默认值，本地/部署用 DB_PASSWORD 环境变量注入
    password: ${DB_PASSWORD:}
  data:
    redis:
      # 生产环境可用环境变量覆盖：REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
      host: ${REDIS_HOST:121.199.172.128}
      port: ${REDIS_PORT:6379}
      # 密码不写默认值，本地/部署用 REDIS_PASSWORD 环境变量注入
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.worklog: debug

# JWT 配置（生产环境务必用 JWT_SECRET 环境变量注入强密钥）
worklog:
  jwt:
    secret: ${JWT_SECRET:worklog-jwt-secret-key-please-change-in-production-2026}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
