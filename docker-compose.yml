# ============================================================
# 工作日志台 Docker Compose
# MySQL / Redis 已作为外部容器运行（docker ps 看名字），
# 通过 `docker network connect worklog-net mysql redis` 加入网络后，
# 后端容器直接用容器名互通（无需 host.docker.internal）。
# ============================================================

services:

  # ---------- 后端：Spring Boot ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: worklog-backend:latest
    container_name: worklog-backend
    restart: unless-stopped
    environment:
      # 数据库（已存在的 mysql 容器，请确保 MYSQL_CONTAINER_NAME 与 docker ps 一致）
      DB_URL: "jdbc:mysql://${MYSQL_CONTAINER_NAME:-mysql}:3306/worklog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: "${DB_USERNAME:-worklog}"
      DB_PASSWORD: "${DB_PASSWORD:-worklog_pwd_change_me}"

      # Redis（已存在的 redis 容器）
      REDIS_HOST: "${REDIS_CONTAINER_NAME:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # JWT
      JWT_SECRET: "${JWT_SECRET:-please_change_me_to_a_random_32_plus_chars_secret}"
      JWT_EXPIRE_HOURS: "${JWT_EXPIRE_HOURS:-24}"

      # JVM
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # 时区（@Scheduled 18:00 cron 按北京时间触发）
      TZ: "Asia/Shanghai"
    ports:
      - "${BACKEND_PORT:-8089}:8089"
    healthcheck:
      # /api/auth/me 未登录会返回 401，属正常；只要服务能响应即视为健康
      test: ["CMD-SHELL", "wget -qO- -S http://127.0.0.1:8089/api/auth/me 2>&1 | grep -Eqi 'HTTP/[0-9.]+ (200|401)'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - worklog-net

  # ---------- 前端：Vue + Nginx ----------
  frontend:
    build:
      context: ../geminix-front
      dockerfile: Dockerfile
      args:
        # 容器内前端请求 /api（被 Nginx 反代到 backend:8089），不要改成绝对地址
        VITE_API_BASE: "/api"
    image: worklog-frontend:latest
    container_name: worklog-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - worklog-net

networks:
  worklog-net:
    # 外部预创建的网络（mysql/redis 已手工 docker network connect 加入），
    # compose 不托管，需先 docker network create worklog-net
    external: true
    name: worklog-net
